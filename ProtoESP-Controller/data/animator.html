<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Proto Animator</title>
  <link rel="shortcut icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <main>
    <h1>ProtoESP - Animator</h1>
    <div> <!-- START OF EARS PART -->
      <h2>Ears</h2>
      <label for="typeEars">Animation: </label> <sup onclick="alert('Select custom or prefab ears animation')">&#9432;</sup>
      <select id="typeEars">
	    <option value="none">none</option>
        <option value="custom">custom</option>
        <option value="rainbow">rainbow</option>
        <option value="white_noise">white_noise</option>
        <option value="corner_sabers">corner_sabers</option>
        <option value="custom_glow">custom_glow</option>
      </select>
	  <label for="earDisplayMode" style="margin-left:30px">Display: </label> <sup onclick="alert('Select display mode and LED config for ears')">&#9432;</sup>
      <select id="earDisplayMode">
        <option value="svg74">SVG 74 LED</option>
        <option value="svg32">SVG 32 LED</option>
        <option value="matrix">Matrix</option>
      </select>
      <div id="earsDiv">
        <div id="divForSvg"></div>
        <br>
        <button onclick="if(confirm('Do you want to empty the current frame?')){fillBlackVisor();}">Fill black</button>
        <button onclick="mirrorEars()">Copy left to right</button><br>
        <div style="clear: both;">
          <label for="timespanEars">Timespan:</label>
          <input type="number" id="timespanEars" value="500" min="1">
          <button onclick="frameGenEars(-1)">Add frame</button>
        </div>
        <div id="earsFramesP"></div>
        <div id="editDivEars" style="display:none">
          <button id="saveEditFrameEars" value="0">Save frame</button>
          <button onclick="deleteFrameEars()">Delete frame</button>
          <button onclick="cloneEarsFrame()">Clone frame</button>
        </div>
      </div>
    </div> <!-- END OF EARS PART -->
    <div class="usedColorsMain">
      <div class="leftBtns">
        <button onclick="playAnim();">Play animation</button>
        <button onclick="stopAnim();">Stop</button>
        <button onclick="nukeAll();">Reset all</button>
      </div>
      <div class="playBtns"> 
        Pick color: <sup onclick="alert('The color which would set the ears color (black = off) or visor RGB pixel color (black = default matrix/visor color)')">&#9432;</sup><input type="color" id="color" value="#000000"> &nbsp;&nbsp;&nbsp; Used colors:
      </div>
      <div id="usedColors"></div>
    </div>
    <div> <!-- START OF VISOR PART -->
      <h2>Visor</h2>
      <label for="visorConfig">Config: </label> <sup onclick="alert('Select config/wiring of your visor\n\'custom_file\' works only if your visor files are on the ESP!')">&#9432;</sup>
      <select id="visorConfig">
        <option value="none">None</option>
        <option value="M16mk2">M16 mk2</option>
        <option value="M16mk3">M16 mk3</option>
        <option value="BFoxCZ">BFoxCZ</option>
        <option value="custom">custom</option>
        <option value="custom_file">custom_file</option>
      </select>
      <label for="typeVisor" style="margin-left:30px">Modifier: </label> <sup onclick="alert('Select modifier for visor animation')">&#9432;</sup>
      <select id="typeVisor">
        <option value="custom">custom</option>
        <option value="all_rainbow">(RGB)all_rainbow</option>
      </select><br>
      <div id="customConfig" style="display: none;">
        <label for="visorCfg">Visor cfg: </label>
        <sup onclick="alert('\'t0\'.. means first matrix etc with numbering\n\'blush0\'.. means first blush segment etc with numbering\n\'-\' means nothing in place\n\'_\' means new line\nExample:\nt0;t1;-;-;-;-;t12;t13;_;-;-;-;t6;t7;-;-;-;_;t2;t3;t4;t5;t8;t9;t10;t11')">&#9432;</sup>
        <input type="text" name="visorCfg" id="visorCfg" size=100><br>
        <label for="mouthCfg">Mouth cfg: </label>
        <sup onclick="alert('Array of bools telling if the segment in order is mouth or not\n(For dynamic speaking effect)\nExample:\n[false,false,true,true,true,true,false,false,true,true,true,true,false,false]')">&#9432;</sup>
        <input type="text" name="mouthCfg" id="mouthCfg" size=100><br>
        <button type="button" onclick="loadCustom();">Load config</button>
      </div>
      <br>
      <div id="visorDiv">
        <div id="matrixes"></div>
        <br><br>
        <p>Matrix control: <sup onclick="alert('There are keyboard shortcuts! Hover over buttons to see!\nTo add or remove matrix to/from selection, hold CTRL/CMD and click on matrix!\nActive pixels on selected matrices will shift over into selected neighbors!')">&#9432;</sup></p> 
        <div style="display: flex;">
          <div>
            <button type="button" onclick='matrixAction = "select";' title="Keyboard: 'S' - Select matrix to work on">Select</button>
            <button type="button" onclick='entireMatrix()' title="Keyboard: 'T' - Toggle entire selected matrix">Toggle</button>
            <div id="shift-buttons-container">
              <button id="shift-up-button" style="left:35px;" title="Keyboard: 'Up' - Shift matrix up">🔼</button>
              <button id="shift-right-button" style="top:35px;left:70px;" title="Keyboard: 'Right' - Shift matrix right">▶️</button>
              <button id="shift-down-button" style="top:70px;left:35px;" title="Keyboard: 'Down' - Shift matrix down">🔽</button>
              <button id="shift-left-button" style="top:35px;" title="Keyboard: 'Left' - Shift matrix left">◀️</button>
              <button id="invert-button" style="top:35px;left:35px;" title="Invert matrix">🔀</button>
              <button id="rotate-back-button"title="Rotate matrix counterclock-wise">🔄</button>
              <button id="rotate-button" style="left:70px;" title="Rotate matrix clockwise">🔃</button>
              <button id="mirrorVertical-button" style="top:70px;left:70px;" title="Invert matrix vertically">↕️</button>
              <button id="mirrorHorizontal-button" style="top:70px;" title="Invert matrix horizontally">↔️</button>
            </div>
          </div>
          <div style="margin-left:20px;">
            <button type="button" onclick='matrixAction = "row";' title="Keyboard: 'R' - Toggle entire clicked row">Row</button> <button type="button" onclick='matrixAction = "col";' title="Keyboard: 'C' - Toggle entire clicked column">Column</button> <sup onclick="alert('Click on Row/Column and then click on Row/Column which you want to toggle')">&#9432;</sup> &nbsp; &nbsp;
            <button type="button" onclick='matrixAction = "paste";'title="Keyboard: 'V' - Select matrix to paste to">Paste</button> <sup onclick="alert('Click on Paste and then click on matrix which you want to paste the currently selected matrix')">&#9432;</sup><br>
            <button type="button" onclick="if(confirm('Do you want to empty the current frame?')){fillBlackVisor();}">Empty visor</button>
            <button type="button" onclick="mirrorVisor()">Copy left to right</button> <sup onclick="alert('Might not work due to wierd config/wiring')">&#9432;</sup><br>
            Segment color: <input type="color" id="fColor" value="#000000"> <sup onclick="alert('For RGB Matrices\n0;0;0 = black = Visor will have color from the config')">&#9432;</sup><br>
            <label for="timespanVisor">Timespan: </label>
            <input type="number" id="timespanVisor" value="500" min="1">
            <button onclick="frameGenVisor(-1)">Add frame</button>
          </div>
        </div>
        <div id="visorFramesP"></div>
        <div id="editDivVisor" style="display:none">
          <button id="saveEditFrameVisor" value="0">Save frame</button>
          <button onclick="deleteFrameVisor()">Delete frame</button>
          <button onclick="cloneVisorFrame()">Clone frame</button>
        </div>
      </div>
    </div> <!-- END OF VISOR PART -->
    <div>
      <h2>Generate</h2>
      1. <button onclick="completeGen()">Generate final JSON</button><br>
      <form action="./savefile" method="post" id="footerForm">
        <label for="output">File content (paste here to load):</label><br>
        <textarea rows="7" cols="50" name="content" id="output" required></textarea><br>
        2. Name of animation (without .json): <input type="text" name="file" required id="fileName" style="margin-top: 5px;"><br>
      </form>
      <p>Load animation:</p>
      <div id="espLoad">
        <select name="file" id="avaibleanims"></select>
        <button type="button" onclick="loadAnim(true)">Load selected anim</button>
        <button type="button" onclick="deleteFile()">Delete selected file</button>
      </div>
      <button type="button" onclick="loadAnim(false)">Load from textarea</button>
      <input type="file" id="localFile" accept=".json" style="display: none;">
      <button onclick="loadLocalFile()">Load from local file</button>
    </div>
    <p style="text-align:center">Coded by <a target=”_blank” href="https://github.com/ncplyn" class="rainbow-text">@NCPlyn</a></p>
  </main>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/vcd15cbe7772f49c399c6a5babf22c1241717689176015" integrity="sha512-ZpsOmlRQV6y907TI0dKBHq9Md29nnaEIPlkf84rnaERnq6zvWvPUqr2ft8M1aS28oN72PdrCzSjY4U6VaAw1EQ==" data-cf-beacon='{"version":"2024.11.0","token":"eee83530bd504643b1521b595f3503df","r":1,"server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>

<style>
  button, input[type="submit"], input[type="file"]::file-selector-button {
    background: rgba(0, 0, 0, 0.2);
    color: white;
    border: 2px solid rgba(255, 255, 255, 0.18);
    border-radius: 5px;
    padding: 6px 8px;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.05s ease;
  }
  button:hover, input[type="submit"]:hover {
    background: rgba(0, 0, 0, 0.3);
  }
  #shift-buttons-container {
    position: relative;
    box-sizing: content-box;
    width: 130px;
    height: 105px;
    margin-bottom: 0 !important;
    margin-left:15px;
  }
  #rotate-button,#rotate-back-button,#invert-button,#shift-up-button,#shift-right-button,#shift-down-button,#shift-left-button,#mirrorVertical-button,#mirrorHorizontal-button {
    position: absolute;
    height: 30px;
    width: 30px;
    box-sizing: border-box;
    padding: 0;
    font-size: 18px;
    background-color: transparent;
    border-radius: 0px;
    border: none;
  }
  input,option,button {
    margin-bottom: 5px;
  }
  input[type=number] {
    width:80px;
  }
  input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
    outline: none;
    border-color: rgba(100, 200, 255, 0.6);
    box-shadow: 0 0 0 3px rgba(100, 200, 255, 0.1);
  }
  input[type="text"], input[type="number"], input[type="file"], select, textarea {
    /*background: rgba(255, 255, 255, 0.15);*/
    background: rgba(0, 0, 0, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.18);
    border-radius: 5px;
    color: white;
    padding: 5px 8px;
    font-size: 14px;
  }
  textarea {
    font-family: 'Courier New', monospace;
  }
  input[type="color"] {
    width: 50px;
    height: 35px;
    border: none;
    cursor: pointer;
    background: transparent;
    vertical-align: middle !important;
  }
  select option {
    background: #52565f;
    color: #ffffff;
  }
  p {
    margin-block-start: 0.5em;
    margin-block-end: 0.3em;
  }
  #output,form label {
    margin-left: 1%;
  }
  #earsFramesP,#visorFramesP {
    font-weight: bold;
    font-size: 30px;
  }
  #earsFramesP a,#visorFramesP a {
    margin-right: 5px;
    margin-left: 5px;
	cursor: pointer;
  }
  h1,h2 {
    margin-block-start: 0.4em;
    margin-block-end: 0.4em;
    text-align:center;
  }
  body {
    background-color: #333743;
    color: white;
    font-family:Verdana;
  }
  main > div {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 10px 25px;
    margin-bottom: 15px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  }
  .colorItem {
    width: 40px;
    min-width: 40px;
    max-width: 40px;
    height: 30px;
    min-height: 30px;
    max-height: 30px;
    border: solid 1px gray;
    cursor: pointer;
  }
  .usedColorsMain button {
    margin-top: 5px;
  }
  .usedColorsMain {
    height: 40px;
    display: flex;
    align-items: center;
    gap: 15px;
  }
  #usedColors {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .playBtns {
    padding-left: 10px;
    white-space: nowrap;
  }
  .leftBtns {
    display: flex;
    gap: 6px;
  }
  path {
    cursor: pointer;
  }
  .leds-matrix {
    background-color: #333;
    border: 1px solid white;
    border-collapse: separate;
    border-spacing: 3px;
  }
  .leds-matrix .item {
    width: 22px;
    min-width: 22px;
    max-width: 22px;
    height: 22px;
    min-height: 22px;
    max-height: 22px;
    cursor: pointer;
    border-radius: 50%;
    box-shadow: inset 0 0 1px #666666;
    background: #808080;
    box-sizing: border-box;
  }
  .leds-matrix .item.active {
    background: var(--active-color, #000000);
    border-style: double;
    border-color: red;
    border-width: 1px;
    box-sizing: border-box;
  }
  .leds-matrix .item:hover {
    box-shadow: 0 0 1px #cccccc;
  }
  .blush {
    margin-left: auto;
    margin-right: auto;
  }
  .blush td {
    width: 30px;
    min-width: 30px;
    max-width: 30px;
    height: 32px;
    min-height: 32px;
    max-height: 32px;
  }
  .blush .item {
    cursor: pointer;
    border-radius: 50%;
    box-shadow: inset 0 0 1px #666666;
    background: #000000;
  }
  sup {
    cursor: pointer;
    color: #64b5f6;
    font-weight: bold;
    transition: color 0.1s ease;
    vertical-align: middle !important;
  }
  sup:hover {
    color: #90caf9;
  }
  .rainbow-text {
    font-weight: bold;
    background-image: repeating-linear-gradient(45deg, violet, indigo, blue, green, yellow, orange, red, violet);
    background-size: 800% 800%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 8s ease infinite;
  }
  @keyframes rainbow {
    0% {background-position: 0% 50%}
    50% {background-position: 100% 25%}
    100% {background-position: 0% 50%}
  }
  #earsFramesP, #visorFramesP {
    font-size: 24px;
    background: rgba(0, 0, 0, 0.2);
    padding: 5px;
    border-radius: 6px;
    min-height: 50px;
    position: relative;
  }
  #earsFramesP::before, #visorFramesP::before {
    content: 'FRAMES';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 50px;
    color: rgba(255, 255, 255, 0.2);
    pointer-events: none;
    z-index: 0;
    letter-spacing: 10px;
  }
  #earsFramesP a, #visorFramesP a {
    margin: 5px;
    cursor: pointer;
    transition: all 0.1s ease;
    display: inline-block;
    padding: 5px 10px;
    background: rgba(100, 181, 246, 0.2);
    border-radius: 5px;
  }
  #earsFramesP a:hover, #visorFramesP a:hover {
    background: rgba(100, 181, 246, 0.3);
  }
  #divForSvg {
    text-align:center;
    overflow-x: auto;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
  }
  #matrixes {
    display: flex;
    justify-content: center;
    overflow-x: auto;
  }
  @media (max-width: 1700px) {
    #matrixes {
      justify-content: flex-start;
    }
  }
</style>

  const rgb2hex = (rgb) => `${rgb.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/).slice(1).map(n => parseInt(n, 10).toString(16).padStart(2, '0')).join('')}`;
  
  /*-----------------------------------HTML GENS / LISTENERS-----------------------------------*/
  // Helper: returns "74" or "32" from current display mode (only relevant for svg)
  function earLedCount() {
    return $("#earDisplayMode").val() === "svg32" ? 32 : 74;

  // Helper: returns "svg" or "matrix"
  function earMode() {
    return $("#earDisplayMode").val() === "matrix" ? "matrix" : "svg";
  }

  // Generate an ear matrix table — same leds-matrix class as visor, items are plain .item td
  function earMatrixHTML(tableId) {
    var out = ['<table class="leds-matrix" id="'+tableId+'">'];
    for (var i = 1; i < 9; i++) {
      out.push('<tr>');
      for (var j = 1; j < 9; j++) {
        out.push('<td class="item ear-item" data-row="' + i + '" data-col="' + j + '"></td>');
      }
      out.push('</tr>');
    }
    out.push('</table>');
    return out.join('');
  }

  // Click/drag handler for ear matrix — same toggle logic as visor matrices
  $(document).on('click', '#divForSvg .ear-item', function(e) {
    if($(this).hasClass('active') && $("#color").val() != "#000000" && !$(this).attr('style')) {} else {
      $(this).toggleClass('active');
    }
    if($(this).hasClass('active') && $("#color").val() != "#000000") {
      $(this).css("background", $("#color").val());
    } else {
      $(this).removeAttr("style");
    }
  });
  $(document).on('mouseenter', '#divForSvg .ear-item', function(e) {
    if(isMouseDown) {
      if($(this).hasClass('active') && $("#color").val() != "#000000" && !$(this).attr('style')) {} else {
        $(this).toggleClass('active');
      }
      if($(this).hasClass('active') && $("#color").val() != "#000000") {
        $(this).css("background", $("#color").val());
      } else {
        $(this).removeAttr("style");
      }
    }
  });

  function Bitmap(hexString) {
    let matrix = fromHexString(hexString);

    function fromHexString(hexString) {
      const out = [];
      for (let i = 0; i < hexString.length / 2; i++) {
        let byte = parseInt(hexString.substr(i * 2, 2), 16).toString(2);
        byte = ('00000000' + byte).substr(-8);
        out.push(byte.split('').reverse());
      }
      return out.reverse();
    }

    function toHexString() {
      const out = [];
      for (let i = 0; i < matrix.length; i++) {
        let byte = parseInt(matrix[i].slice().reverse().join(''), 2).toString(16);
        byte = ('0' + byte).substr(-2);
        out.push(byte);
      }
      return out.reverse().join('');
    }

    function transpose() {
      for (let i = 0; i < matrix.length; i++) {
        for (let j = i; j < 8; j++) {
          const tmp = matrix[i][j];
          matrix[i][j] = matrix[j][i];
          matrix[j][i] = tmp;
        }
      }
    }

    function shiftLeft() {
      for (let i = 0; i < matrix.length; i++) {
        const len = matrix[i].length - 1;
        for (let j = 0; j < len; j++) {
          matrix[i][j] = matrix[i][j + 1];
        }
        matrix[i][len] = 0;
      }
    }

    function shiftRight() {
      for (let i = 0; i < matrix.length; i++) {
        const len = matrix[i].length - 1;
        for (let j = len; j > 0; j--) {
          matrix[i][j] = matrix[i][j - 1];
        }
        matrix[i][0] = 0;
      }
    }

    function rotate() {
      matrix.reverse();
      transpose();
    }

    function rotateBack() {
      transpose();
      matrix.reverse();
    }
    
    function mirrorHorizontal() {
      for (let i = 0; i < matrix.length; i++) {
        matrix[i].reverse();
      }
    }

    function mirrorVertical() {
      matrix.reverse();
    }

    return {
      toHexString: toHexString,
      shiftLeft: shiftLeft,
      shiftRight: shiftRight,
      rotate: rotate,
      rotateBack: rotateBack,
      mirrorHorizontal: mirrorHorizontal,
      mirrorVertical: mirrorVertical,
      getMatrix: () => matrix,
      setMatrix: (newMatrix) => { matrix = newMatrix; },
    }
  }
  
  //build neighbor map from visType
  function buildNeighborMap() {
    if (!visType) return {};
    
    let rows = visType.split('_');
    let grid = rows.map(row => row.split(';'));
    let neighborMap = {};
    
    // Find position of each matrix in the grid
    let positions = {};
    for (let r = 0; r < grid.length; r++) {
      for (let c = 0; c < grid[r].length; c++) {
        let cell = grid[r][c].trim();
        if (cell.startsWith('t')) {
          let matrixId = cell.substring(1);
          positions[matrixId] = { row: r, col: c };
        }
      }
    }
    
    // Build neighbor relationships
    for (let id in positions) {
      let pos = positions[id];
      neighborMap[id] = {
        left: null,
        right: null,
        up: null,
        down: null
      };
      if (pos.col > 0) { // Check left
        let leftCell = grid[pos.row][pos.col - 1].trim();
        if (leftCell.startsWith('t')) {
          neighborMap[id].left = leftCell.substring(1);
        }
      }
      if (pos.col < grid[pos.row].length - 1) { // Check right
        let rightCell = grid[pos.row][pos.col + 1].trim();
        if (rightCell.startsWith('t')) {
          neighborMap[id].right = rightCell.substring(1);
        }
      }
      if (pos.row > 0 && grid[pos.row - 1][pos.col]) { // Check up
        let upCell = grid[pos.row - 1][pos.col].trim();
        if (upCell.startsWith('t')) {
          neighborMap[id].up = upCell.substring(1);
        }
      }
      if (pos.row < grid.length - 1 && grid[pos.row + 1][pos.col]) { // Check down
        let downCell = grid[pos.row + 1][pos.col].trim();
        if (downCell.startsWith('t')) {
          neighborMap[id].down = downCell.substring(1);
        }
      }
    }
    return neighborMap;
  }
  
  /*---COLOR MATRIX HELPERS: read/write per-pixel colors alongside bitmap state---*/
  // Returns an 8x8 array of color strings (null = no per-pixel color set)
  // Row 0 = top row of matrix (data-row=1), Col 0 = leftmost (data-col=1)
  function getColorMatrix(id) {
    let cm = [];
    for (let r = 0; r < 8; r++) {
      cm[r] = [];
      for (let c = 0; c < 8; c++) {
        let elem = $('#t'+id).find('td.item[data-row="'+(r+1)+'"][data-col="'+(c+1)+'"]');
        let style = elem.attr('style');
        cm[r][c] = style ? elem.css('background-color') : null;
      }
    }
    return cm;
  }

  // Writes an 8x8 color matrix back to the DOM
  function applyColorMatrix(id, cm) {
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        let elem = $('#t'+id).find('td.item[data-row="'+(r+1)+'"][data-col="'+(c+1)+'"]');
        if (cm[r][c]) {
          elem.css('background-color', cm[r][c]);
        } else {
          elem.removeAttr('style');
        }
      }
    }
  }

  // Returns a deep copy of an 8x8 color matrix
  function cloneColorMatrix(cm) {
    return cm.map(row => row.slice());
  }

  // Transposes an 8x8 color matrix in-place
  function transposeColorMatrix(cm) {
    for (let i = 0; i < 8; i++) {
      for (let j = i+1; j < 8; j++) {
        let tmp = cm[i][j];
        cm[i][j] = cm[j][i];
        cm[j][i] = tmp;
      }
    }
  }

  //function that gets data from timespan input and SVG pictures or ear matrices, creates frames formated in JSON

  function frameGenEars(editing) {
    if ($("#timespanEars").val().length == 0 && $("#timespanEars").val() > 0) {
      alert("Timespan missing");
    } else {
      var temp = "{\"timespan\":" + $("#timespanEars").val() + ",\"leds\":[";
      if (earMode() === "svg") {
        var ledNum = earLedCount()/2 + 1;
        for (var x = 1; x < ledNum; x++) {
          if (x > 1) temp += ",";
          temp += "\"" + (($("#svg1").find("#" + x).attr('fill') || "").substring(1) || "0") + "\"";
        }
        for (var x = 1; x < ledNum; x++) {
          temp += ",";
          temp += "\"" + (($("#svg2").find("#" + x).attr('fill') || "").substring(1) || "0") + "\"";
        }
      } else {
        // Matrix mode: save 64 entries per side (row-major)
        // Each entry: "000000" = off, "color" = active with default color, "rrggbb" = active with per-pixel color
        var first = true;
        for (var s = 1; s <= 2; s++) {
          for (var r = 1; r < 9; r++) {
            for (var c = 1; c < 9; c++) {
              if (!first) temp += ",";
              first = false;
              var elem = $("#svg"+s).find('.ear-item[data-row="'+r+'"][data-col="'+c+'"]');
              if (!elem.hasClass('active')) {
                temp += "\"0\"";
              } else if (elem.attr('style')) {
                temp += "\"" + rgb2hex(elem.css("background-color")) + "\"";
              } else {
                temp += "\"000000\""; // active, default color
              }
            }
          }
        }
      }
      temp += "]}";
      if (editing < 0) {
        framesEars.push(temp);
        $("#earsFramesP").append("<a id=\"" + (framesEars.length - 1) + "\">" + (framesEars.length - 1) + "</a>");
      } else {
        framesEars[editing] = temp;
      }
    }
  }

  //fixes hex pattern
  function fixPattern(pattern) {
    pattern = pattern.replace(/[^0-9a-fA-F]/g, '0');
    return ('0000000000000000' + pattern).substr(-16);
  }

  //loads leds from hex
  function hexInputToLeds(segment, value) {
    var val = fixPattern(value);
    for (var i = 1; i < 9; i++) {
      var byte = val.substr(-2 * i, 2);

      byte = parseInt(byte, 16);
      for (var j = 1; j < 9; j++) {
        var active = !!(byte & 1 << (j - 1));
        $('#t' + segment).find('.item[data-row=' + i + '][data-col=' + j + '] ').toggleClass('active', active);
      }
    }
  }
  
  //return hex of segment
  function ledsToHex(segment) {
    var out = [];
    for (var i = 1; i < 9; i++) {
      var byte = [];
      for (var j = 1; j < 9; j++) {
        var active = $('#t' + segment).find('.item[data-row=' + i + '][data-col=' + j + '] ').hasClass('active');
        byte.push(active ? '1' : '0');
      }
      byte.reverse();
      byte = parseInt(byte.join(''), 2).toString(16);
      byte = ('0' + byte).substr(-2);
      out.push(byte);
    }
    out.reverse();
    return out.join('');
  }

  //loads animation from textarea or from file
  function loadAnim(loadFrom) {
    fillBlack();
    fillBlackVisor();
    var response;
    if (loadFrom) {
      response = $.ajax({
        type: "GET",
        url: "/anims/"+$("#avaibleanims").val(),
        async: false
      }).responseText;
    } else {
      response = $("#output").val();
    }
    var obj = JSON.parse(response);
    if (obj.ears.type == "custom" || obj.ears.type == "custom_glow") {
      framesEars.length = 0;
      $("#earsFramesP").html("");
      $("#earsDiv").show();
      $('#typeEars option[value="'+obj.ears.type+'"]').prop('selected', true);
      for (var x = 0; x < obj.ears.frames.length; x++) {
        framesEars.push(JSON.stringify(obj.ears.frames[x]));
        $("#earsFramesP").append("<a id=\"" + (framesEars.length - 1) + "\">" + (framesEars.length - 1) + "</a>");
      }
    } else {
      $('#typeEars option[value="'+obj.ears.type+'"]').prop('selected', true);
      $("#earsDiv").hide();
    }
    framesVisor.length = 0;
    $("#visorFramesP").html("");
    $('#typeVisor option[value="'+obj.visor.type+'"]').prop('selected', true);
    for (var x = 0; x < obj.visor.frames.length; x++) {
      framesVisor.push(JSON.stringify(obj.visor.frames[x]));
      $("#visorFramesP").append("<a id=\"" + (framesVisor.length - 1) + "\">" + (framesVisor.length - 1) + "</a>");
    }
    alert("Loaded animation");
  }
</script>
