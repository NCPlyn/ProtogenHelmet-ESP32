<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ProtoESP</title>
    <meta name="viewport" content="width=device-width, initial-scale=0.95" />
    <link rel="shortcut icon" href="data:," />
  </head>
  <body>
    <main>
      <div>
        <h1>ProtoESP</h1>
        <p>Active anim:</p>
        <h4 id="activeAnim"></h4>
        <br><hr>
        <div class="anim_buttons1"></div>
        <div class="anim_buttons2"></div>
        <hr><br>
        <a href="/animator.html" class="small-btn">Animator</a>
        <a class="animbtn" href="/rgb">VisorRGB</a>
        <a href="/update" class="small-btn">OTA Update</a><br><br>
        
        <input type="file" id="cfgFile" style="display:none" accept=".json">
        <a class="small-btn" onclick="document.getElementById('cfgFile').click()">Load config.json</a>
        <a href="/config.json" class="small-btn" download>Download config</a><br><br>
        
        <input type="file" id="zipInput" style="display:none" accept=".zip,.json">
        <a class="small-btn" onclick="document.getElementById('zipInput').click()">Upload anims .json/.zip</a>
        <a class="small-btn" onclick="downloadZip()">Download animations</a><br><br>
      </div>
      <div>
        <hr>
        <h1>Configuration</h1>
        <hr>
        <div class="config">
          <h2>Basic</h2>
          <form>
            <label for="fanspeed">Fan</label>
            <input type="range" min="0" max="255" value="200" id="fanspeed">
            <label for="boop">Boop</label>
            <input type="checkbox" id="boop">
            <label for="speech">Speech</label>
            <input type="checkbox" id="speech">
            <label for="tilt">Tilt</label>
            <input type="checkbox" id="tilt">
            <label for="ble">BLE</label>
            <input type="checkbox" id="ble">
            <label for="oled">OLED</label>
            <input type="checkbox" id="oled">
            <br>
            <button type="button" onclick="saveConfig()">Save config</button>
          </form>
        </div>
        <hr>
        <div class="config">
          <h2>Advanced</h2>
          <form action="./saveconfig" method="get">
            <i><label>Name</label></i>
            <i><span>Value</span></i>
            <label for="visColor" id="visColorLabel">Visor color <sup onclick="alert('The default color if using WS2812 panels.\nUse full bright color/top of the picker as more dark color = less brightness on panel!')">&#9432;</sup></label>
            <input type="color" name="visColor" id="visColor">
            <label for="bEar">Brightness ears <sup onclick="alert('Range: 0-255\nDefault: 64')">&#9432;</sup></label>
            <input type="number" name="bEar" min="0">
            <label for="bVisor">Brightness visor <sup onclick="alert('Range:\nWS2812: 0-255\nMAX7219\nDefault: 100 / 15')">&#9432;</sup></label>
            <input type="number" name="bVisor" min="0" max="255">
            <label for="bOled">Brightness OLED <sup onclick="alert('Range: 0-2\nDefault: 2')">&#9432;</sup></label>
            <input type="number" name="bOled" min="0" max="2">
            <label for="rbSpeed">Rainbow prefab speed <sup onclick="alert('Range: 1-200ms\nDefault: 15')">&#9432;</sup></label>
            <input type="number" name="rbSpeed" min="1" max="200">
            <label for="rbWidth">Rainbow hue width <sup onclick="alert('Range: 1-32\nDefault: 8')">&#9432;</sup></label>
            <input type="number" name="rbWidth" min="1" max="32">
            <label for="spMin">Speak min delay <sup onclick="alert('Range: 20-500ms\nDefault: 90')">&#9432;</sup></label>
            <input type="number" name="spMin" min="20" max="500">
            <label for="spMax">Speak max delay <sup onclick="alert('Range: 30-600ms\nDefault: 130')">&#9432;</sup></label>
            <input type="number" name="spMax" min="30" max="600">
            <label for="spTrig">Speak trigger point <sup onclick="alert('Range: 500-2500\nDefault: 1800')">&#9432;</sup></label>
            <input type="number" name="spTrig" min="500" max="2500">
            <label for="boopThresh">Boop distance threshold <sup onclick="alert('Range: 5-250\nDefault: 10')">&#9432;</sup></label>
            <input type="number" name="boopThresh" min="5" max="250">
            <label for="aTilt">Tilt sideways animation <sup onclick="alert('Default: confused.json')">&#9432;</sup></label>
            <select id="aTilt" name="aTilt"></select>
            <label for="aUp">Tilt up animation <sup onclick="alert('Default: upset.json')">&#9432;</sup></label>
            <select id="aUp" name="aUp"></select>
            <label for="aBoop">Boop animation <sup onclick="alert('Default: boop.json')">&#9432;</sup></label>
            <select id="aBoop" name="aBoop"></select>
            <label for="wifiName">WiFi AP SSID <sup onclick="alert('Default: ProtoWiFi\nChange this so other people remotes don\'t connect to your protogen if multiple people running ProtoESP are at the same place!')">&#9432;</sup></label>
            <input type="text" name="wifiName" minlength="9">
            <label for="wifiPass">WiFi AP Password <sup onclick="alert('Default: Proto1234\nSame applies here as for the SSID!')">&#9432;</sup></label>
            <input type="text" name="wifiPass" minlength="9"><br>
            <button type="submit">Save config</button>
          </form>
        </div>
        <hr>
        <div>
          <h2>Tilt Calibration</h2>
          <form action="./saveconfig" method="get">
            <i><p>X Y Z</p></i>
            Idle: 
            <input type="number" name="neutralX" step="any" min="-1" max="1">
            <input type="number" name="neutralY" step="any" min="-1" max="1">
            <input type="number" name="neutralZ" step="any" min="-1" max="1">
            <button type="button" onclick="pullFor('Neutral')">Pull data</button>
            <br>
            Tilt: 
            <input type="number" name="tiltX" step="any" min="-1" max="1">
            <input type="number" name="tiltY" step="any" min="-1" max="1">
            <input type="number" name="tiltZ" step="any" min="-1" max="1">
            <button type="button" onclick="pullFor('Tilt')">Pull data</button>
            <br>
            Up: 
            <input type="number" name="upX" step="any" min="-1" max="1">
            <input type="number" name="upY" step="any" min="-1" max="1">
            <input type="number" name="upZ" step="any" min="-1" max="1">
            <button type="button" onclick="pullFor('Up')">Pull data</button>
            <br>
            Tilt toleration:
            <input type="number" name="tiltTol" step="any" min="0.01" max="1">
            <br>
            <button type="submit">Save tilt</button>
          </form>
        </div>
      </div>
      <p style="text-align:center">Coded by <a target=”_blank” href="https://github.com/ncplyn" class="rainbow-text">@NCPlyn</a></p>
    </main>
  </body>
</html>

<style>
  p,h4 {
    margin:0.3em;
  }
  .anim_buttons1 {
    display: inline-block;
  }
  .anim_buttons2 {
    display: inline-block;
    vertical-align:top;
  }
  .config form {
    display:grid;
    grid-template-columns: max-content max-content;
    grid-gap:5px;
    justify-content: center;
  }
  .config form label       { text-align:right; }
  .config form label:after { content: ":"; }
  h1,h2 {
    margin-block-start: 0.4em;
    margin-block-end: 0.4em;
  }
  body {
    font-family:Verdana;
    margin:0;
    background-color:#333743;
    color:white;
    text-align:center;
  }
  main {
    width: fit-content;
    margin: auto;
  }
  input:not(#fanspeed), select {
    background-color:#21252B;
    color:white;
    border:3px solid #3f444d;
    border-radius:4px;
    padding: 5px 8px;
    margin-top:3px;
  }
  label,span {
    margin-top:7px;
  }
  button, a {
    text-decoration: none;
    background-color:#24282b;
    border:2px solid #3B4048;
    border-radius:12px;
    color:#f5f5f5;
    padding: 0.45rem 0.75rem;
    font-size: 1rem;
    transition: color .15s ease-in-out,background-color .15s ease-in-out,border-color .15s ease-in-out,box-shadow .15s ease-in-out;
  }
  button:hover, a:hover {
    background-color:#474a4d;
  }
  button:active, a:active {
    position:relative;
    top:1px;
  }
  .small-btn {
    line-height: 1;
    font-size: 0.7rem;
  }
  input[type="color"] {
    padding: 1px 5px !important;
    width: auto !important;
  }
  .animbtn {
    line-height: 2.5;
  }
  .rainbow-text {
    font-weight: bold;
    background-image: repeating-linear-gradient(45deg, violet, indigo, blue, green, yellow, orange, red, violet);
    background-size: 800% 800%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 8s ease infinite;
    border: none;
    padding: 0;
  }
  @keyframes rainbow {
    0% {background-position: 0% 50%}
    50% {background-position: 100% 25%}
    100% {background-position: 0% 50%}
  }
  sup {
    cursor: pointer;
  }
</style>

<script src="jquerymin.js"></script>
<script>
  let availableAnims = [];

	function fillSelect(id,val) {
		var select, option;
		select = document.getElementById(id);
		option = document.createElement('option');
		option.value = option.text = val;
		select.add(option);
	}

  $("#fanspeed").change(function() {
    var xhr = new XMLHttpRequest();
		xhr.open("GET", "/fanpwm?duty="+$("#fanspeed").val(), true);
    xhr.onload = function() {
      if (xhr.status === 200) {
        if (xhr.responseText.includes("Set")) {
          //do nothing
        } else {
          alert(xhr.responseText);
        }
      }
    }
	  xhr.send(null);
  });

  $("#ledType").change(function() {
    if($("#ledType").val() == "WS2812") {
      $("#visColor").show();
      $("#visColorLabel").show();
    } else {
      $("#visColor").hide();
      $("#visColorLabel").hide();
    }
  });

	function loadFiles() {
		xmlhttp=new XMLHttpRequest();
		xmlhttp.onreadystatechange=function()
		{
			if (xmlhttp.readyState==4 && xmlhttp.status==200)
			{
				var partsArray = xmlhttp.responseText.split(';');
				partsArray.pop();
				document.getElementById("activeAnim").innerHTML = partsArray[0];
				var arrayLength = partsArray.length;
				for (var i = 1; i < arrayLength; i++) {
          if(i % 2 === 0) {
            $('.anim_buttons1').append('<a class="animbtn" href="/change?anim=' + partsArray[i] + '">' + partsArray[i].replace('.json','') + '</a><br>');
          } else {
            $('.anim_buttons2').append('<a class="animbtn" href="/change?anim=' + partsArray[i] + '">' + partsArray[i].replace('.json','') + '</a><br>');
          }
					fillSelect("aTilt",partsArray[i]);
					fillSelect("aUp",partsArray[i]);
          fillSelect("aBoop",partsArray[i]);
				}
        partsArray.shift();
        availableAnims = partsArray;
			}
		}
		xmlhttp.open("GET", "/getfiles", false);
		xmlhttp.send();
	}
	loadFiles();
  
  function pullFor(what) {
		xmlhttp=new XMLHttpRequest();
		xmlhttp.onreadystatechange=function()
		{
			if (xmlhttp.readyState==4 && xmlhttp.status==200)
			{
				var partsArray = xmlhttp.responseText.split(';');
        if (what == "Neutral") {
          document.getElementsByName("neutralX")[0].value = parseFloat(partsArray[0]).toFixed(2);
          document.getElementsByName("neutralY")[0].value = parseFloat(partsArray[1]).toFixed(2);
          document.getElementsByName("neutralZ")[0].value = parseFloat(partsArray[2]).toFixed(2);
        } else if (what == "Tilt") {
          document.getElementsByName("tiltX")[0].value = parseFloat(partsArray[0]).toFixed(2);
          document.getElementsByName("tiltY")[0].value = parseFloat(partsArray[1]).toFixed(2);
          document.getElementsByName("tiltZ")[0].value = parseFloat(partsArray[2]).toFixed(2);
        } else if (what == "Up") {
          document.getElementsByName("upX")[0].value = parseFloat(partsArray[0]).toFixed(2);
          document.getElementsByName("upY")[0].value = parseFloat(partsArray[1]).toFixed(2);
          document.getElementsByName("upZ")[0].value = parseFloat(partsArray[2]).toFixed(2);
        } 
			}
		}
		xmlhttp.open("GET", "/gyro", false);
		xmlhttp.send();
	}
  
  function loadIntoInputs(jsonobj) {
        var obj = JSON.parse(jsonobj);
				document.getElementById("boop").checked = obj.boopEna;
				document.getElementById("speech").checked = obj.speechEna;
				document.getElementById("tilt").checked = obj.tiltEna;
				document.getElementById("ble").checked = obj.bleEna;
        document.getElementById("oled").checked = obj.oledEna;
				document.getElementsByName("bEar")[0].value = obj.bEar;
				document.getElementsByName("bVisor")[0].value = obj.bVisor;
        document.getElementsByName("bOled")[0].value = obj.bOled;
				document.getElementsByName("rbSpeed")[0].value = obj.rbSpeed;
				document.getElementsByName("rbWidth")[0].value = obj.rbWidth;
				document.getElementsByName("spMin")[0].value = obj.spMin;
				document.getElementsByName("spMax")[0].value = obj.spMax;
				document.getElementsByName("spTrig")[0].value = obj.spTrig;
				document.getElementsByName("aTilt")[0].value = obj.aTilt;
				document.getElementsByName("aUp")[0].value = obj.aUp;
        document.getElementsByName("aBoop")[0].value = obj.aBoop;
        document.getElementsByName("visColor")[0].value = obj.visColor;
        document.getElementsByName("neutralX")[0].value = obj.neutralX;
        document.getElementsByName("neutralY")[0].value = obj.neutralY;
        document.getElementsByName("neutralZ")[0].value = obj.neutralZ;
        document.getElementsByName("tiltX")[0].value = obj.tiltX;
        document.getElementsByName("tiltY")[0].value = obj.tiltY;
        document.getElementsByName("tiltZ")[0].value = obj.tiltZ;
        document.getElementsByName("upX")[0].value = obj.upX;
        document.getElementsByName("upY")[0].value = obj.upY;
        document.getElementsByName("upZ")[0].value = obj.upZ;
        document.getElementsByName("tiltTol")[0].value = obj.tiltTol;
        document.getElementsByName("wifiName")[0].value = obj.wifiName;
        document.getElementsByName("wifiPass")[0].value = obj.wifiPass;
        document.getElementById("fanspeed").value = obj.fanDuty;
        document.getElementsByName("boopThresh")[0].value = obj.boopThresh;
  }

	function loadConfig() {
		xmlhttp=new XMLHttpRequest();
		xmlhttp.onreadystatechange=function()
		{
			if (xmlhttp.readyState==4 && xmlhttp.status==200)
			{
				loadIntoInputs(xmlhttp.responseText);
			}
		}
		xmlhttp.open("GET", "/config.json", false );
    xmlhttp.setRequestHeader('Cache-Control', 'no-cache, no-store, max-age=0');
    xmlhttp.setRequestHeader('Expires', 'Thu, 1 Jan 1970 00:00:00 GMT');
    xmlhttp.setRequestHeader('Pragma', 'no-cache');
		xmlhttp.send();
	}
	loadConfig();

	function saveConfig() {
		var params = "boopEna="+document.getElementById("boop").checked+"&speechEna="+document.getElementById("speech").checked+"&tiltEna="+document.getElementById("tilt").checked+"&bleEna="+document.getElementById("ble").checked+"&oledEna="+document.getElementById("oled").checked;
		var xhr = new XMLHttpRequest();
		xhr.open("GET", "/saveconfig?"+params, true);
    xhr.onload = function() {
      if (xhr.status === 200) {
        if (xhr.responseURL.includes("saved.html?main")) {
          window.location.replace("/saved.html?main");
        } else {
          alert(xhr.responseText);
        }
      }
    }
	  xhr.send(null);
	}
  
  document.getElementById("cfgFile").addEventListener("change", cfgLoad, false);
  function cfgLoad() {
    let fileToLoad = this.files[0];
    if(fileToLoad === undefined || fileToLoad.name.includes("config.json") == false) {
      alert("No selected file or not a config.json file!");
    } else {
      let fileReader = new FileReader();
      fileReader.onload = function (fileLoadedEvent) {
          if (!fileLoadedEvent.target.result.includes("wifiName")) {
            alert("Most likely invalid file");
            return;
          }
          loadIntoInputs(fileLoadedEvent.target.result);
          alert("Config, loaded.\nPlease save!");
      };
      fileReader.readAsText(fileToLoad, "UTF-8");
    }
  }
  
  function downloadZip() {
      // Lazy load JSZip
      const script = document.createElement('script');
      script.src = "/jszip.min.js";

      script.onload = async () => {
        const zip = new JSZip();

        for (const fileName of availableAnims) {
          try {
            const response = await fetch(`./anims/${fileName}`, {
              cache: 'no-store',
              headers: {
                'Cache-Control': 'no-cache, no-store, max-age=0',
                'Pragma': 'no-cache',
                'Expires': '0'
              }
            });
            if (!response.ok) throw new Error(`Failed to load ${fileName}`);
            const jsonText = await response.text();
            zip.file(fileName, jsonText);
          } catch (err) {
            console.error(`Error fetching ${fileName}:`, err);
          }
        }

        zip.generateAsync({ type: "blob" }).then(content => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(content);
          a.download = 'anims.zip';
          a.click();
        });
      };

      document.head.appendChild(script);
  }

  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }

  $('#zipInput').on('change', async function(event) {
      if(confirm("This will replace same named animations!\nYou sure?") == false) {
        return;
      }
      const file = event.target.files[0];
      if (!file) return;
      if(file.name.includes(".json")) { //just json
        const content = await readFileAsText(file);
        if (!content.includes("frames")) {
          alert("Most likely invalid file");
          return;
        }

        const fileName = file.name.replace(/\.json$/, '');

        const formData = new FormData();
        formData.append('file', fileName);
        formData.append('content', content);

        const response = await fetch('/savefile', {
          method: 'POST',
          body: formData,
          cache: 'no-store',
          headers: {
           'Cache-Control': 'no-cache, no-store, max-age=0',
           'Pragma': 'no-cache',
           'Expires': '0'
          }
        });
                
        const text = await response.text();

        if (text.includes("Error opening file") || text.includes("No valid parameters")) {
          alert("Failed to upload");
        } else {
          alert("Animation uploaded");
        }
      } else { //zip with jsons
        const script = document.createElement('script');
        script.src = "/jszip.min.js";

        script.onload = async () => {
          try {
            const zipData = await file.arrayBuffer();
            const zip = await JSZip.loadAsync(zipData);

            const jsonFiles = Object.values(zip.files).filter(f => f.name.endsWith('.json'));

            if (jsonFiles.length === 0) {
              alert('No .json files found in the ZIP.');
              return;
            }

            let successCount = 0;
            let failureCount = 0;

            for (const fileEntry of jsonFiles) {
              try {
                const content = await fileEntry.async('text');
                if(!content.includes("frames")) { //invalid json
                  alert("Most likely invalid file within the .zip :"+fileEntry.name);
                  failureCount++;
                } else {
                  const fileName = fileEntry.name.replace(/\.json$/, '');

                  const formData = new FormData();
                  formData.append('file', fileName);
                  formData.append('content', content);

                  const response = await fetch('/savefile', {
                    method: 'POST',
                    body: formData,
                    cache: 'no-store',
                    headers: {
                      'Cache-Control': 'no-cache, no-store, max-age=0',
                      'Pragma': 'no-cache',
                      'Expires': '0'
                    }
                  });
                  
                  const text = await response.text();

                  if (text.includes("Error opening file") || text.includes("No valid parameters")) {
                    console.error(`Failed saving ${fileName}:`, text);
                    failureCount++;
                  } else {
                    successCount++;
                  }
                }
              } catch (err) {
                console.error(`Failed to process ${fileEntry.name}`, err);
                failureCount++;
              }
            }

            if (failureCount === 0) {
              alert(`All ${successCount} files saved successfully!`);
            } else {
              alert(`${successCount} succeeded, ${failureCount} failed.`);
            }

          } catch (err) {
            console.error('Error reading ZIP file:', err);
            alert('Something went wrong reading the ZIP file.');
          }
        };

        script.onerror = () => {
          alert('Failed to load JSZip library.');
        };

        document.head.appendChild(script);
      }
    });
</script>
